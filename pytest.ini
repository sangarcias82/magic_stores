[pytest]
pythonpath = .
testpaths = tests
# Third-party deprecation notices we can't act on (they come from inside Starlette's test client,
# for the versions requirements.txt allows). Our own code must not raise warnings: see
# tests/test_warnings.py. Only these exact messages are ignored.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated

<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page_title or "Magic Stores" }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/platform.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">Magic Stores</a>
      <nav>
        <a href="/">{{ t("nav.stores") }}</a>
        <a href="/api/health">API</a>
        {% if request.session.get("user_id") %}
        <a href="/admin">{{ t("nav.admin") }}</a>
        <form class="inline-form" method="post" action="/logout">
          <button type="submit" class="link-button">{{ t("nav.sign_out") }}</button>
        </form>
        {% else %}
        <a href="/login">{{ t("nav.sign_in") }}</a>
        {% endif %}
        {% include "_language_switcher.html" %}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer wrap">
    <p>{{ t("platform.footer") }}</p>
  </footer>
</body>
</html>
